name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 New Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['bug', 'fix']
  - title: '📚 Documentation'
    labels: ['docs', 'documentation']
  - title: '🔧 Maintenance'
    labels: ['chore', 'deps', 'ci']
  - title: '⚠️ Breaking Changes'
    labels: ['breaking']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels: ['breaking', 'major']
  minor:
    labels: ['feature', 'enhancement', 'minor']
  patch:
    labels: ['bug', 'fix', 'patch', 'docs', 'chore']
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/Saiyam-Sandhir-Jain/kbvc/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

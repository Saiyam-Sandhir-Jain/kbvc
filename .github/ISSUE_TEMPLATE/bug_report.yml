name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands or code to reproduce the issue.
      placeholder: |
        1. kbvc init
        2. kbvc add myfile.md
        3. kbvc commit -m "test"
        4. Error appears
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (paste full output / traceback)
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KBVC version
      placeholder: "0.1.0  (run: kbvc --version)"
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.9", "3.10", "3.11", "3.12", "other"]
    validations:
      required: true

  - type: dropdown
    id: backends
    attributes:
      label: Backends in use (select all that apply)
      multiple: true
      options:
        - OpenAI (embed)
        - Gemini (embed)
        - Ollama (embed)
        - HuggingFace (embed)
        - Qdrant
        - pgvector
        - Pinecone
        - ChromaDB
        - None / dry-run only

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — OS, repo structure, config snippet.

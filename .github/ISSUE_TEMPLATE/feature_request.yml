name: Feature Request
description: Suggest a new feature or improvement for KBVC
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe it in detail.

  - type: dropdown
    id: phase
    attributes:
      label: Related Phase
      description: Which KBVC phase does this relate to?
      options:
        - "Phase 1 — Core versioning (init/add/commit/log)"
        - "Phase 2 — Time travel (status/checkout/diff)"
        - "Phase 3 — Knowledge graph (link/query/graph)"
        - "Phase 4 — Audit + dependencies (branch/depends/impact/trace)"
        - "Phase 5 — Multi-source ingestion + analytics"
        - "Phase 6 — Infrastructure + provenance (backend/explain/promote)"
        - "Phase 7 — Maintenance ops (gc/migrate)"
        - "Phase 8 — Sync (volatility-aware auto-commit)"
        - "Phase 9 — Contradictions"
        - "Phase 10 — AI Q&A (ask)"
        - "New Phase / Not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the current limitation?
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Describe the feature. What CLI command(s) would it add or change?
        What would the output look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR to implement this feature
